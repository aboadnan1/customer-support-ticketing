services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_DB: customer_support_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-support-ticketing
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/customer_support_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-me-to-a-long-random-secret-key-for-production
      JWT_EXPIRATION_MS: 3600000
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
