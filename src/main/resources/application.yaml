spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/customer_support_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-for-production}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
