spring:
  datasource:
    url: jdbc:h2:mem:ticketing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
jwt:
  secret: ${JWT_SECRET:test-secret-key-for-local-development-only-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
